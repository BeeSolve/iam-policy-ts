# Publish workflow for @beesolve/iam-policy-ts
#
# Trusted Publishing Configuration (npmjs.com):
#   Package: @beesolve/iam-policy-ts
#   Repository: BeeSolve/iam-policy-ts
#   Workflow: publish.yml
#   Environment: (leave empty — no environment required)

name: Publish

on:
  workflow_dispatch:
  workflow_call:

permissions:
  id-token: write
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: npm ci

      - run: npm test

      - run: npm run build

      - run: npm install -g npm@latest

      - name: Set version
        run: |
          VERSION="$(date -u +'%-y.%-m.%-d')"
          npm version "$VERSION" --no-git-tag-version
          echo "PUBLISH_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Publish if not already published
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if npm view "@beesolve/iam-policy-ts@$PUBLISH_VERSION" version 2>/dev/null; then
            echo "Version $PUBLISH_VERSION already published — skipping."
          else
            npm publish --access public
            echo "PUBLISHED=true" >> "$GITHUB_ENV"
          fi

      - name: Commit version back to repo
        if: env.PUBLISHED == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "v$PUBLISH_VERSION"
          git push
