name: Update & Publish

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  update-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: npm ci

      - run: npm run generate

      - name: Check for catalog changes
        id: diff
        run: |
          if git diff --exit-code src/catalog/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - run: npm test

      - run: npm run build

      - run: npm install -g npm@latest

      - name: Set version
        run: |
          VERSION="$(date -u +'%-y.%-m.%-d')"
          npm version "$VERSION" --no-git-tag-version
          echo "PUBLISH_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Publish
        if: steps.diff.outputs.changed == 'true' || vars.DEBUG == 'true'
        run: |
          if npm view "@beesolve/iam-policy-ts@$PUBLISH_VERSION" version 2>/dev/null; then
            echo "Version $PUBLISH_VERSION already published — skipping."
          else
            npm publish --provenance --access public
            echo "PUBLISHED=true" >> "$GITHUB_ENV"
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true' || env.PUBLISHED == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/catalog/ package.json package-lock.json
          git diff --cached --quiet || git commit -m "v$PUBLISH_VERSION"
          git push
