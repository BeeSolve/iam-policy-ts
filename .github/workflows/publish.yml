# Publish workflow for @beesolve/iam-policy-ts
#
# Trusted Publishing Configuration (npmjs.com):
#   Package: @beesolve/iam-policy-ts
#   Repository: beesolve/iam-policy-ts
#   Workflow: publish.yml
#   Environment: (leave empty — no environment required)

name: Publish

on:
  workflow_dispatch:
  workflow_call:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - run: npm test

      - run: npm run build

      - run: npm install -g npm@latest

      - name: Set version
        run: |
          VERSION="$(date -u +'%-y.%-m.%-d')"
          npm version "$VERSION" --no-git-tag-version
          echo "PUBLISH_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Publish if not already published
        run: |
          if npm view "@beesolve/iam-policy-ts@$PUBLISH_VERSION" version 2>/dev/null; then
            echo "Version $PUBLISH_VERSION already published — skipping."
          else
            npm publish --provenance --access public
          fi
